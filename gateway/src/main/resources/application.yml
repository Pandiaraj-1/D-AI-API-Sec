server:
  port: 8080

spring:
  application:
    name: ai-sec-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/orders/**
        - id: checkout-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/checkout/**

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      threatEngine:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

firewall:
  jwt-secret: ${FIREWALL_JWT_SECRET}
  threat-engine-url: "http://threat-engine:8000"
  threat-engine-timeout-ms: 25
  rate-escalation-threshold: 15
  blocklist-ttl-seconds: 900
  high-risk-endpoints:
    - /api/auth/login
    - /api/checkout
  numeric-baselines:
    "/api/checkout:qty": [1, 10]
    "/api/checkout:price": [1, 10000]
    "/api/checkout:discount_pct": [0, 30]

logging:
  level:
    com.aisecfirewall.gateway: INFO
