name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  threat-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: threat-engine
        run: pip install -r requirements-dev.txt
      - name: "Train model (also produces the artifacts the tests score against)"
        working-directory: threat-engine
        run: python train/train_model.py
      - name: Unit tests
        working-directory: threat-engine
        run: pytest -q

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and unit test
        working-directory: gateway
        run: mvn -B clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: [threat-engine, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (no push - validates every Dockerfile)
        env:
          JWT_SECRET: ci-only-secret-change-me-before-use-1234567890
        run: docker compose build
